# ATENÇÃO: valores de EXEMPLO, só para o kind. Na AWS, o Secret billing-service-secrets é criado pelo
# CD a partir do Secrets Manager e não fica versionado.
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
  namespace: oficina-billing
type: Opaque
stringData:
  ConnectionStrings__BillingDb: "Host=postgres;Port=5432;Database=billing;Username=billing;Password=billing_dev"
  POSTGRES_PASSWORD: "billing_dev"
  Jwt__Key: "OficinaMecanicaSecretKeyMustBe32CharactersMin!"
  RabbitMq__Username: "oficina"
  RabbitMq__Password: "oficina_dev"
