apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay AWS (EKS), usado pelo CD em homolog e prod:
#   - imagem do ECR: kustomize edit set image oficina-billing-service=<ecr>/<repo>:<sha>;
#   - TargetGroupBinding: registra os pods no target group do serviço no NLB interno
#     (__TARGET_GROUP_ARN__ = saída target_group_arns do oficina-infra-k8s, trocada no CD);
#   - Secret billing-service-secrets: criado pelo CD a partir do Secrets Manager (não fica aqui).
resources:
  - ../../base
  - targetgroupbinding.yaml

images:
  - name: oficina-billing-service
    newName: oficina-billing-service
    newTag: latest

patches:
  # Custo em homolog: 1 réplica, e o HPA sobe até 3 sob carga. Em prod, suba minReplicas.
  - target:
      kind: Deployment
      name: billing-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: billing-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: ConfigMap
      name: billing-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: billing-service-config
      data:
        # __API_BASE_URL__: URL do API Gateway (saída api_endpoint do oficina-lambda-auth), trocada no CD.
        Orcamento__UrlAprovacao: "__API_BASE_URL__/api/orcamentos/{0}"
        Pagamentos__MercadoPago__NotificationUrl: "__API_BASE_URL__/webhooks/mercadopago"
