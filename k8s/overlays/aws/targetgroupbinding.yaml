# Registra os pods do Service billing-service como alvos IP do target group do serviço no NLB interno
# (oficina-infra-k8s). Quem reconcilia é o AWS Load Balancer Controller.
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: billing-service
  labels:
    app: billing-service
spec:
  serviceRef:
    name: billing-service
    port: 80
  targetType: ip
  targetGroupARN: "__TARGET_GROUP_ARN__"
