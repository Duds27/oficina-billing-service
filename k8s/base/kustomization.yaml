apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Núcleo do billing-service: orçamento, aprovação e pagamento (Mercado Pago).
# O namespace oficina-billing é criado pelo oficina-infra-k8s na AWS e pelo overlay local no kind.
# Secret (billing-service-secrets) e banco ficam nos overlays.
namespace: oficina-billing

labels:
  - pairs:
      app.kubernetes.io/part-of: oficina-mecanica
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
