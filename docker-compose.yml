# Ambiente local do billing-service.
# No esqueleto, a API só expõe health checks e Swagger. As variáveis de banco e
# RabbitMQ passam a ser lidas na Etapa 3 (persistência e mensageria).
services:
  billing-api:
    build: .
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BillingDb: Host=billing-db;Port=5432;Database=billing;Username=billing;Password=billing_dev
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: oficina
      RabbitMq__Username: oficina
      RabbitMq__Password: oficina_dev
      Pagamentos__Gateway: Fake
    depends_on:
      billing-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  billing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing_dev
    ports:
      - "5432:5432"
    volumes:
      - billing_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    # Versão a confirmar no spike S1 (MassTransit 8.x + RabbitMQ 4.x).
    # O usuário "guest" só conecta via localhost, por isso o usuário próprio.
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: oficina
      RABBITMQ_DEFAULT_PASS: oficina_dev
      RABBITMQ_DEFAULT_VHOST: oficina
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  billing_pg_data:
